<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Vanish</title>
  <meta name="description" content="Sign in to your Vanish account to access your active notes ledger and manage one-time secrets.">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">
        <span class="brand-icon">⚡</span>
        <span>VANISH</span>
      </a>

      <div class="nav-right">
        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="register.html" class="nav-link">Create Account</a></li>
          </ul>
        </nav>
        <button type="button" class="theme-toggle-btn" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-wrapper">
    <div class="card auth-card">
      <div class="card-header">
        <h1 class="card-title">Welcome Back</h1>
        <p class="card-subtitle">Sign in to monitor your secret notes and read receipts.</p>
      </div>

      <!-- Server Alert -->
      <div id="serverAlert" style="display: none;"></div>

      <!-- Login Form -->
      <form id="loginForm" action="dashboard_preview.html" method="GET" novalidate>
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="Enter your username" 
            autocomplete="username"
            required>
          <div id="usernameError" class="error-feedback"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="#" class="form-hint" style="text-decoration: underline;" onclick="alert('Zero-retention policy: Passwords cannot be recovered. If forgotten, please create a new account.'); return false;">Forgot?</a>
          </div>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password" 
              autocomplete="current-password"
              required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Show password">👁</button>
          </div>
          <div id="passwordError" class="error-feedback"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
          Sign In
        </button>

        <!-- Redirect to Register -->
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
          Don't have an account? 
          <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one free</a>
        </p>
      </form>
    </div>
  </main>

  <div class="toast-container"></div>

  <!-- Footer -->
  <footer>
    <div class="container footer-content">
      <div>&copy; 2026 Vanish &bull; Military-grade One-Time Secret Handoff</div>
      <div><span>Zero Knowledge &bull; End-to-End In-Memory Encryption</span></div>
    </div>
  </footer>

  <script src="js/validation.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
